{{ $p := site.GetPage "" }}
<section>
    <h2><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"
            style="margin-right: 8px; vertical-align: text-bottom;"><path fill="#7a8494"
                d="M12 1.5 2.5 6.5v11L12 22.5l9.5-5v-11L12 1.5Zm0 2.3 6.9 3.6L12 11 5.1 7.4 12 3.8ZM4.5 9.1l6.5 3.4v7.4l-6.5-3.4V9.1Zm8.5 10.8v-7.4l6.5-3.4v7.4L13 19.9Z"/></svg>Open-Source Tools</h2>
    <p>
    <ul class="sw-list">
        {{- range .Site.Data.software -}}
        <li>
            <strong>{{- .name -}}</strong>:&nbsp;{{- .desc | $p.RenderString -}}
            {{- range .links -}}<span class="pub-link">{{- partial "link" . -}}</span>{{- end -}}
            {{- if .note -}}<span class="sw-note">{{- .note -}}</span>{{- end -}}
            {{- if .install -}}<span class="sw-install">{{- .install -}}</span>{{- end -}}
        </li>
        {{- end -}}
    </ul>
    </p>
</section>
